[package]
name = "mylist"
version = "1.0.0"
description = "Biblioteca multimedia personal"
edition = "2024"

[lib]
name = "mylist_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled", "backup"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

tempfile = "3"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.11"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.18", default-features = false }
